<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="NavBar.css" />
    <title>NavBar</title>
  </head>
  <body>
    <form action="">
      <nav class="Navbar">
        <div class="hamburger">
          <div class="menu btn1" data-menu="1">
            <div class="icon-left"></div>
            <div class="icon-right"></div>
          </div>
          <ul>
            <li><a class="Menu" href="">NavBar</a></li>
            <li><a class="Home" href="">Home</a></li>
            <li><a class="Link" href="">Link</a></li>
            <li>
              <a class="Dropdown" href="">Dropdown</a
              ><label for="Dropdown-list"></label>
              <select id="Dropdown-list" name="Dropdown-list">
                <optgroup label="Dropdown-list">
                  <option value="0"></option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                </optgroup>
              </select>
            </li>
            <li>Disabled</li>
            <li>
              <input
                class="search"
                type="search"
                slot="search"
                placeholder="Search"
              />
              <button type="submit" class="Button">Search</button>
            </li>
          </ul>
        </div>
      </nav>
    </form>
  </body>
</html>
